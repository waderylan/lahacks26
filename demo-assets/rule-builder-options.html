<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four ways to build a rule | Transaction Review</title>
  <style>
    /* Standalone prototype. Original Transaction Review palette; no frameworks or external assets. */
    :root { color-scheme:light; --bg:#f6f7f5; --paper:#fff; --text:#1b2420; --muted:#58665e; --line:#dfe3dc; --green:#1f7a4d; --tint:#e1f3e8; --soft:#f0f4f0; --red:#a7342c; --radius:7px; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI",Arial,sans-serif; }
    button,input,textarea,select { font:inherit; color:inherit; }
    button,a,input,textarea,select { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius); padding:9px 14px; font-weight:600; line-height:1.35; }
    button:hover { background:var(--soft); border-color:#aebdb2; }
    button:disabled { cursor:default; opacity:.48; }
    button:disabled:hover { background:var(--paper); border-color:var(--line); }
    button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid #1f7a4d; outline-offset:3px; }
    input,select,textarea { border:1px solid #b9c5bc; border-radius:var(--radius); background:var(--paper); padding:10px 12px; min-width:0; }
    input[type=checkbox],input[type=radio] { accent-color:var(--green); width:17px; height:17px; flex-shrink:0; }
    input::placeholder,textarea::placeholder { color:#68756d; opacity:1; }
    input[type=number] { font-variant-numeric:tabular-nums; }
    textarea { resize:vertical; line-height:1.7; width:100%; }
    ::selection { background:#c5e6d1; color:var(--text); }
    input,textarea { caret-color:var(--green); }
    [hidden] { display:none!important; }
    .primary { background:var(--green); color:#fff; border-color:var(--green); }
    .primary:hover { background:#175f3b; color:#fff; border-color:#175f3b; }
    .primary:disabled,.primary:disabled:hover { background:#e4ebe5; color:#46594c; border-color:#e4ebe5; opacity:1; }
    .quiet { background:transparent; border-color:transparent; color:var(--muted); padding:8px; font-weight:500; }
    .quiet:hover { border-color:transparent; color:var(--green); }
    .small { font-size:12px; }
    .muted { color:var(--muted); }
    .stack { display:grid; gap:10px; }
    .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .spread { justify-content:space-between; }
    .field { display:grid; gap:7px; font-size:13px; font-weight:600; }
    .field input,.field select,.field textarea { width:100%; font-weight:400; }
    .divider { border:0; border-top:1px solid var(--line); margin:24px 0; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:25px; font-weight:650; line-height:1.3; letter-spacing:-.7px; }
    h2 { font-size:20px; line-height:1.4; font-weight:650; letter-spacing:-.45px; }
    h3 { font-size:15px; font-weight:650; }
    .appbar { background:var(--paper); border-bottom:1px solid var(--line); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { color:var(--green); font-size:16px; font-weight:700; letter-spacing:-.3px; }
    .brand span { color:var(--text); font-weight:400; margin-left:18px; border-left:1px solid var(--line); padding-left:18px; }
    .demo-label { color:var(--muted); font-size:12px; white-space:nowrap; }
    .comparison { position:sticky; top:0; z-index:10; background:var(--paper); padding:0 32px; border-bottom:1px solid var(--line); }
    .tabs { max-width:1400px; margin:auto; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .tab { border:0; border-bottom:3px solid transparent; border-radius:0; padding:20px 14px 17px; display:flex; text-align:left; gap:12px; align-items:flex-start; background:transparent; }
    .tab:hover { background:var(--bg); border-bottom-color:var(--line); }
    .tab[aria-selected=true] { border-bottom-color:var(--green); background:var(--soft); }
    .tab-num { display:grid; place-items:center; width:27px; height:27px; flex-shrink:0; color:var(--muted); border:1px solid var(--line); border-radius:5px; font-size:12px; }
    .tab[aria-selected=true] .tab-num { background:var(--green); color:white; border-color:var(--green); }
    .tab strong { display:block; font-size:14px; margin:1px 0 3px; }
    .tab small { font-weight:400; color:var(--muted); font-size:12px; }
    .main { max-width:1464px; padding:28px 32px 40px; margin:auto; }
    .view-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .view-heading p { color:var(--muted); margin-top:6px; font-size:13px; }
    .shell { background:var(--paper); border:1px solid var(--line); border-radius:10px; min-height:610px; overflow:hidden; }
    .success { border:1px solid #b6d7c1; background:var(--tint); color:#175c39; border-radius:var(--radius); padding:13px 16px; font-size:13px; margin-top:18px; }
    .error { color:var(--red); font-size:13px; padding-top:12px; }
    .logic-summary { line-height:1.8; color:var(--text); }
    .logic-summary mark { color:#175c39; background:var(--tint); padding:2px 5px; border-radius:3px; }
    .preview-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 24px; border-bottom:1px solid var(--line); }
    .preview-heading strong { font-size:15px; font-weight:650; }
    .preview-heading span { color:var(--muted); font-size:12px; }
    .table-wrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; text-align:left; font-size:13px; white-space:nowrap; }
    th { font-size:11px; color:var(--muted); font-weight:600; background:#f8faf7; }
    td,th { padding:15px 18px; border-bottom:1px solid #e9ede7; }
    th:first-child,td:first-child { padding-left:24px; }
    td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .matched td { background:#f0f8f2; }
    .dim td { color:#657269; }
    .bill-vendor { display:block; font-weight:550; }
    .bill-note { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
    .match-label { color:var(--green); font-size:12px; font-weight:600; }
    .no-match { color:var(--muted); font-size:12px; }
    .preview-note { font-size:12px; color:var(--muted); padding:18px 24px; }
    .empty { padding:48px 24px; color:var(--muted); text-align:center; font-size:13px; }
    .bottom-note { color:var(--muted); font-size:12px; margin-top:20px; display:flex; gap:15px; justify-content:space-between; }
    .text-link { border:0; background:none; padding:0; font-size:12px; color:var(--green); text-decoration:underline; text-underline-offset:3px; }
    /* Option 1: the prompt is the editor; the sheet is the proof. */
    .language-layout { display:grid; grid-template-columns:minmax(310px,.9fr) minmax(0,1.35fr); }
    .language-editor { padding:32px; border-right:1px solid var(--line); }
    .language-editor h2 { margin-bottom:10px; }
    .language-editor > p { color:var(--muted); font-size:13px; margin-bottom:22px; }
    .prompt { min-height:170px; font-size:17px; padding:18px; margin-top:5px; }
    .prompt-label { font-weight:600; font-size:12px; }
    .prompt-examples { margin:13px 0 23px; display:flex; gap:6px; flex-wrap:wrap; }
    .prompt-examples button { font-weight:400; font-size:11px; padding:6px 9px; }
    .understood { margin-top:28px; border-top:1px solid var(--line); padding-top:23px; }
    .understood h3 { margin-bottom:10px; }
    .understood p { font-size:14px; }
    .understood .then-line { border-top:1px solid var(--line); margin-top:16px; padding-top:16px; }
    .language-actions { margin-top:22px; display:flex; align-items:center; gap:14px; }
    /* Option 2: one decision per step, with a persistent plain-language summary. */
    .guided-layout { display:grid; grid-template-columns:225px minmax(0,1fr) 285px; }
    .steps { background:#f8faf7; padding:30px 20px; border-right:1px solid var(--line); }
    .step-link { display:flex; align-items:center; gap:12px; width:100%; padding:13px 10px; border:0; background:transparent; text-align:left; margin-bottom:5px; color:var(--muted); }
    .step-link[aria-current=step] { background:var(--tint); color:#175c39; }
    .step-number { border:1px solid #c8d1c8; width:25px; height:25px; border-radius:50%; display:grid; place-items:center; font-size:11px; flex-shrink:0; }
    .step-link[aria-current=step] .step-number { border-color:var(--green); background:var(--green); color:#fff; }
    .guide-content { padding:36px; display:flex; flex-direction:column; min-height:610px; }
    .guide-content > p { color:var(--muted); margin-top:7px; }
    .guide-fields { padding:28px 0; flex:1; }
    .guide-nav { display:flex; justify-content:space-between; gap:10px; padding-top:22px; border-top:1px solid var(--line); }
    .guide-summary { background:#fafbf9; padding:32px 24px; border-left:1px solid var(--line); }
    .guide-summary h3 { margin-bottom:18px; }
    .guide-summary .summary-part { padding:17px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .summary-part b { font-weight:600; display:block; margin-bottom:5px; }
    .guide-group { margin:0 0 24px; border:0; padding:0; }
    .guide-group legend { font-size:13px; font-weight:600; margin-bottom:12px; padding:0; }
    .category-options { display:flex; flex-wrap:wrap; gap:8px; }
    .category-option { cursor:pointer; display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font-size:13px; background:white; }
    .category-option:has(input:checked) { background:var(--tint); border-color:#96c7a7; color:#175c39; }
    .guide-constraint { display:flex; align-items:center; gap:9px; margin-top:18px; font-size:13px; flex-wrap:wrap; }
    .amount-input { width:110px; }
    .alternative { padding-top:23px; margin-top:23px; border-top:1px solid var(--line); }
    .guide-join { margin-bottom:20px; width:100%; font-size:13px; }
    .action-choice { display:flex; align-items:flex-start; gap:13px; border:1px solid var(--line); border-radius:var(--radius); padding:17px; cursor:pointer; margin-bottom:11px; }
    .action-choice:has(input:checked) { border-color:#96c7a7; background:#f3f9f4; }
    .action-choice b { font-weight:600; }
    .action-choice small { color:var(--muted); display:block; margin-top:4px; }
    .action-choice input { margin-top:3px; }
    .guide-confirm { border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:22px; }
    .guide-confirm h3 { margin-bottom:12px; }
    .guide-confirm p { margin-top:10px; }
    .mini-bills { margin-top:20px; }
    .mini-bill { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .guide-content,.guide-summary { min-width:0; }
    .semantic-group-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:16px; }
    .semantic-group-head select { padding:8px 10px; font-size:12px; max-width:100%; }
    .semantic-condition { padding:3px 0; }
    .condition-label { font-weight:600; font-size:12px; }
    .semantic-condition textarea { font-size:16px; padding:15px; min-height:100px; margin:8px 0; }
    .semantic-condition-tools { gap:8px; }
    .semantic-condition-tools select { font-size:11px; padding:5px 7px; }
    .semantic-condition-tools > span { font-size:11px; }
    .semantic-connector { padding:18px 0 13px; font-size:11px; font-weight:650; color:var(--green); }
    .semantic-group > .group-controls { margin-top:18px; }
    .semantic-nested { border:1px solid #bdcdbf; border-radius:7px; padding:17px; background:#f8faf7; margin:10px 0; }
    .semantic-examples { margin-top:26px; font-size:12px; color:var(--muted); }
    .semantic-examples summary { cursor:pointer; }
    .semantic-example { display:block; width:100%; text-align:left; font-size:12px; font-weight:400; margin-top:9px; padding:11px; color:var(--text); }
    .side-counts { display:grid; gap:10px; font-size:12px; margin-top:15px; }
    .side-counts strong { font-size:17px; display:inline-block; min-width:22px; color:var(--text); font-weight:600; }
    .preview-counts { display:flex; gap:20px; flex-wrap:wrap; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:12px; }
    .preview-counts strong { font-size:20px; margin-right:4px; font-weight:650; }
    .preview-counts span:first-child { color:var(--green); }
    .semantic-preview { min-width:0; }
    .semantic-preview select { font-size:12px; padding:7px 9px; }
    .semantic-preview table { font-size:12px; }
    .semantic-preview td,.semantic-preview th { padding:12px; }
    .semantic-preview th:first-child,.semantic-preview td:first-child { padding-left:12px; }
    .judgment { display:inline-block; padding:3px 6px; border-radius:4px; font-size:11px; color:var(--muted); white-space:nowrap; }
    .judgment-true { color:#175c39; background:var(--tint); }
    .judgment-uncertain { color:#78521b; background:#fff1d3; }
    .judgment-pending { border:1px solid var(--line); }
    .vendor-button { padding:0; border:0; border-radius:0; background:none; color:var(--green); font-size:12px; font-weight:600; }
    .vendor-button:hover { background:none; text-decoration:underline; text-underline-offset:3px; }
    .semantic-inspection { padding:19px; margin-top:20px; border:1px solid var(--line); border-radius:7px; }
    .semantic-inspection dl { margin:16px 0; font-size:12px; display:grid; grid-template-columns:65px 1fr; gap:9px; }
    .semantic-inspection dt { color:var(--muted); }.semantic-inspection dd { margin:0; }
    .condition-evidence { border-top:1px solid var(--line); padding-top:12px; margin-top:13px; }.condition-evidence p { margin-top:7px; font-size:12px; line-height:1.7; }
    /* Option 3: familiar spreadsheet filters lead; rule setup is secondary. */
    .sheet-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; }
    .sheet-main { min-width:0; }
    .sheet-tools { padding:24px; border-bottom:1px solid var(--line); }
    .sheet-tools h2 { margin-bottom:18px; }
    .filter-row { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin:10px 0; }
    .filter-row input { padding:8px; width:95px; }
    .filter-row select { padding:8px 10px; font-size:12px; }
    details.filter { position:relative; }
    .filter summary { cursor:pointer; list-style:none; border:1px solid #b9c5bc; border-radius:var(--radius); padding:8px 11px; font-size:12px; background:#fff; }
    .filter summary::-webkit-details-marker { display:none; }
    .filter summary::after { content:' ▾'; color:var(--muted); }
    .filter-menu { position:absolute; top:calc(100% + 6px); left:0; width:225px; background:#fff; border:1px solid var(--line); box-shadow:0 8px 24px #1b242014; border-radius:var(--radius); padding:8px; z-index:3; }
    .filter-menu label { display:flex; align-items:center; gap:9px; padding:9px; cursor:pointer; font-size:13px; }
    .filter-menu label:hover { background:var(--soft); }
    .sheet-group { padding:13px 14px; border:1px solid var(--line); border-radius:var(--radius); background:#f8faf7; margin-top:13px; }
    .sheet-group > .row { margin-bottom:5px; }
    .join-control { padding:5px 8px; border-color:#afc8b7; color:#175c39; font-size:11px; min-width:62px; }
    .sheet-save { border-left:1px solid var(--line); padding:28px 23px; background:#fafbf9; display:flex; flex-direction:column; }
    .sheet-save h2 { font-size:19px; margin-bottom:8px; }
    .sheet-save > p { color:var(--muted); font-size:13px; margin-bottom:25px; }
    .sheet-save .field { margin-bottom:20px; }
    .sheet-save .rule-count { padding:20px 0; margin-top:auto; border-top:1px solid var(--line); font-size:13px; }
    .sheet-save .rule-count strong { color:var(--green); }
    .sheet-count { font-size:12px; color:var(--muted); padding:14px 24px; display:flex; justify-content:space-between; gap:12px; }
    .sheet-main td,.sheet-main th { padding:13px 15px; }
    .sheet-main td:first-child,.sheet-main th:first-child { padding-left:24px; }
    /* Option 4: literal nested groups; the boundary carries order of operations. */
    .groups-layout { display:grid; grid-template-columns:minmax(0,1fr) 370px; }
    .groups-editor { padding:30px 36px; }
    .groups-top { display:flex; gap:12px; justify-content:space-between; align-items:center; margin-bottom:25px; }
    .group { border:1px solid #bdcdbf; border-radius:var(--radius); background:white; margin:12px 0; }
    .group-top { padding:13px 15px; background:#f1f6f0; display:flex; gap:10px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); border-radius:7px 7px 0 0; }
    .group-top select { background:transparent; border:0; padding:3px 1px; font-size:13px; font-weight:600; max-width:100%; }
    .group-body { padding:8px 15px 15px; }
    .condition { display:grid; grid-template-columns:minmax(110px,1fr) minmax(110px,1.3fr) auto; gap:9px; padding:10px 0; align-items:center; }
    .condition > select,.condition-value select,.condition-value input { width:100%; padding:9px 10px; font-size:13px; }
    .condition-value { display:flex; align-items:center; gap:7px; min-width:0; }
    .condition .quiet { padding:7px; font-size:11px; }
    .condition .money-prefix { font-size:13px; color:var(--muted); }
    .connector { font-size:10px; font-weight:700; color:var(--green); padding:1px 0; letter-spacing:.4px; }
    .group-controls { display:flex; gap:10px; flex-wrap:wrap; padding-top:8px; }
    .group-controls button { font-size:12px; padding:7px 10px; }
    .group-empty { font-size:13px; color:var(--muted); padding:15px 0; }
    .then-action { display:grid; grid-template-columns:1fr 1fr; gap:13px; border-top:1px solid var(--line); margin-top:27px; padding-top:23px; }
    .then-action h3 { grid-column:1/-1; margin-bottom:3px; }
    .groups-proof { border-left:1px solid var(--line); background:#fafbf9; padding:30px 25px; display:flex; flex-direction:column; }
    .groups-proof h3 { margin-bottom:15px; }
    .groups-proof .logic-summary { font-size:14px; }
    .groups-proof .save-area { padding-top:24px; margin-top:auto; }
    .groups-proof .field { margin-bottom:15px; }
    .parentheses { background:white; border:1px solid var(--line); border-radius:5px; padding:12px; font:12px/1.8 "Consolas",monospace; overflow-wrap:anywhere; }
    .grouping-details { margin-top:22px; font-size:12px; }
    .grouping-details summary { cursor:pointer; color:var(--muted); margin-bottom:10px; }
    .save-area .primary { width:100%; }
    @media (min-width:1500px) { .main { padding-top:35px; } .language-editor { padding:40px; } }
    @media (max-width:1100px) {
      .guided-layout { grid-template-columns:180px minmax(0,1fr); } .guide-summary { grid-column:1/-1; border-left:0; border-top:1px solid var(--line); display:flex; gap:24px; padding:20px 28px; flex-wrap:wrap; } .guide-summary h3 { width:100%; margin:0; } .guide-summary .summary-part { padding:0; border:0; flex:1; min-width:200px; }
      .groups-layout { grid-template-columns:minmax(0,1fr) 310px; } .groups-editor { padding:25px; } .language-editor { padding:25px; } .sheet-layout { grid-template-columns:minmax(0,1fr) 270px; }
      .tab { padding-left:8px; padding-right:8px; gap:8px; } .tab small { font-size:11px; }
    }
    @media (max-width:800px) {
      .appbar { padding:15px 18px; } .brand span { display:none; } .demo-label { font-size:11px; }
      .comparison { padding:0 10px; } .tabs { grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; } .tab { padding:13px 9px 11px; } .tab strong { font-size:13px; } .tab small { display:none; }
      .main { padding:23px 16px 30px; } h1 { font-size:22px; } .view-heading { align-items:flex-start; gap:12px; margin-bottom:20px; } .view-heading p { max-width:35ch; } .view-heading > button { padding:7px 9px; font-size:11px; white-space:nowrap; }
      .language-layout,.sheet-layout,.groups-layout { grid-template-columns:1fr; } .language-editor { border-right:0; border-bottom:1px solid var(--line); padding:25px 22px; } .prompt { min-height:145px; font-size:16px; } .language-actions { margin-top:17px; }
      .understood { margin-top:24px; } .shell { min-height:0; } .preview-heading { padding:20px; } .preview-note { padding:16px 20px; } td,th { padding:12px 14px; }
      .guided-layout { grid-template-columns:1fr; } .steps { display:flex; gap:4px; padding:10px; border-right:0; border-bottom:1px solid var(--line); } .step-link { justify-content:center; padding:9px 5px; font-size:11px; margin:0; gap:7px; } .step-number { width:22px; height:22px; }
      .semantic-group-head { align-items:flex-start; flex-wrap:wrap; }.semantic-group-head select { font-size:11px; }.semantic-condition textarea { font-size:15px; }.semantic-nested { padding:11px; }.semantic-condition-tools > span { display:none; }.preview-counts { gap:14px; }.preview-counts strong { font-size:17px; }
      .guide-content { min-height:520px; padding:26px 22px; } .guide-summary { padding:23px; gap:17px; } .guide-summary .summary-part { min-width:150px; } .category-option { padding:9px 10px; font-size:12px; } .guide-confirm { padding:18px; }
      .sheet-save { border-left:0; border-top:1px solid var(--line); padding:24px; } .sheet-save .rule-count { margin-top:10px; } .sheet-tools { padding:23px 20px; } .sheet-tools h2 { font-size:19px; }
      .groups-editor { padding:24px 18px; } .groups-proof { padding:25px 22px; border-left:0; border-top:1px solid var(--line); } .groups-proof .save-area { margin-top:24px; }
      .group-body { padding:7px 10px 12px; } .group-top { padding:12px 10px; gap:3px; } .group-top select { font-size:12px; } .condition { grid-template-columns:minmax(83px,1fr) minmax(100px,1.3fr) auto; gap:5px; } .condition > select,.condition-value select,.condition-value input { font-size:11px; padding:9px 5px; } .condition .quiet { font-size:10px; padding:5px 2px; } .group .group .condition { grid-template-columns:minmax(70px,1fr) minmax(80px,1.2fr); } .group .group .condition .quiet { grid-column:1/-1; justify-self:end; }
      .then-action { grid-template-columns:1fr; } .bottom-note { flex-direction:column; gap:10px; } .groups-top { align-items:flex-start; } .groups-top p { max-width:28ch; }
    }
    @media (prefers-reduced-motion:no-preference) { button { transition:background .14s ease,border-color .14s ease; } }
  </style>
</head>
<body>
  <header class="appbar"><div class="brand">Transaction Review <span>Rule builder options</span></div><span class="demo-label">Interactive demo · Fictional bills</span></header>
  <div class="comparison"><nav class="tabs" role="tablist" aria-label="Compare rule builders">
    <button class="tab" role="tab" id="tab-plain" aria-controls="demo-panel" data-tab="plain"><span class="tab-num">1</span><span><strong>Plain English</strong><small>Describe what you want</small></span></button>
    <button class="tab" role="tab" id="tab-guided" aria-controls="demo-panel" data-tab="guided"><span class="tab-num">2</span><span><strong>Guided steps</strong><small>Plain English, three steps</small></span></button>
    <button class="tab" role="tab" id="tab-sheet" aria-controls="demo-panel" data-tab="sheet"><span class="tab-num">3</span><span><strong>Spreadsheet filters</strong><small>Start with the bills</small></span></button>
    <button class="tab" role="tab" id="tab-groups" aria-controls="demo-panel" data-tab="groups"><span class="tab-num">4</span><span><strong>Match groups</strong><small>Build it with simple fields</small></span></button>
  </nav></div>
  <main class="main"><div class="view-heading"><div><h1 id="view-title"></h1><p id="view-description"></p></div><button class="quiet" id="reset">Reset demo</button></div>
    <section id="demo-panel" role="tabpanel" tabindex="0"></section>
    <footer class="bottom-note"><span>Same starting rule in all four: software or equipment, over $500, still needs review.</span><span>Everything stays in this demo. No real bills change.</span></footer>
  </main>
  <script>
    'use strict';
    const bills = [
      {id:'B-1041',vendor:'Linear',note:'Annual project software',category:'Software',amount:72000,reviewed:false,memo:'Receipt attached'},
      {id:'B-1042',vendor:'Dell',note:'Monitor and docking station',category:'Equipment',amount:145000,reviewed:false,memo:'Check equipment receipt'},
      {id:'B-1043',vendor:'Google Workspace',note:'Annual team licenses',category:'Software',amount:86400,reviewed:false,memo:'Annual renewal'},
      {id:'B-1044',vendor:'Figma',note:'Monthly design seats',category:'Software',amount:12000,reviewed:false,memo:'Receipt attached'},
      {id:'B-1045',vendor:'Apple',note:'Laptop for a new employee',category:'Equipment',amount:210000,reviewed:true,memo:'Approved and received'},
      {id:'B-1046',vendor:'United Airlines',note:'Flight to a client meeting',category:'Travel',amount:68000,reviewed:false,memo:'Receipt missing'},
      {id:'B-1047',vendor:'Pacific Utilities',note:'Office electricity',category:'Utilities',amount:32500,reviewed:false,memo:'Monthly service'},
      {id:'B-1048',vendor:'B&H',note:'Webcam and microphone',category:'Equipment',amount:45000,reviewed:false,memo:'Receipt attached'}
    ];
    const categories=['Software','Equipment','Travel','Utilities'];
    const people=['Sam Whitaker','Priya Natarajan','Marcus Bell'];
    const actions={task:'Create a review task',message:'Draft an internal message',assign:'Assign the bills'};
    const actionPast={task:'would get review tasks',message:'would be included in a message draft',assign:'would be assigned'};
    const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:2});
    const money=cents=>usd.format(cents/100);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let nextId=0;
    const id=()=>`n${++nextId}`;
    const condition=(field,value)=>({id:id(),kind:'condition',field,value});
    const group=(join,children)=>({id:id(),kind:'group',join,children});
    const initialTree=()=>group('all',[condition('category','Software|Equipment'),condition('amount','500'),condition('review','needs')]);
    const initialFilter=()=>({categories:['Software','Equipment'],amount:'500',review:'needs',join:'all'});
    const promptDefault='Find software or equipment bills over $500 that still need review.\nCreate a review task for Sam.';
    let plain,guide,sheet,groups;
    const reset=()=>{
      plain={text:promptDefault,tree:initialTree(),owner:people[0],action:'task',previewText:promptDefault,error:'',saved:false};
      guide={step:0,tree:semanticGroup('all',[semanticCondition(semanticPrompts.physical),semanticCondition(semanticPrompts.recurring)]),owner:people[0],action:'task',messageRequest:'Ask whether this is a one-off purchase or a monthly service, and whether the bill should be recoded.',name:'Check recurring-service memos on goods',resultFilter:'all',inspect:null,saved:false};
      sheet={filters:[initialFilter()],join:'any',owner:people[0],action:'task',name:'Review larger purchases',matchesOnly:false,saved:false};
      groups={tree:initialTree(),owner:people[0],action:'task',name:'Review larger purchases',saved:false};
    };
    const semanticPrompts={physical:'The line items describe physical goods rather than an ongoing service.',recurring:'The memo describes a recurring service or subscription.',missing:'The memo says a receipt is missing.',contradiction:'The memo describes a recurring service, but the line items are for physical goods.'};
    function semanticCondition(text=''){return {id:id(),kind:'semantic',text,negate:false};}
    function semanticGroup(join,children){return {id:id(),kind:'semantic-group',join,children};}
    // Authored example judgments only. Custom wording is preserved, never parsed into field filters.
    const semanticBills=bills.map(bill=>({...bill,memo:({'B-1042':'Monthly technology service for October.','B-1045':'Monthly charge for new starter setup.','B-1048':'Recurring office service for October.'}[bill.id])||bill.memo}));
    const semanticFixtures={physical:['false','true','false','false','true','false','false','true'],recurring:['false','true','true','false','uncertain','false','true','true'],missing:['false','false','false','false','false','true','false','false'],contradiction:['false','true','false','false','uncertain','false','false','true']};
    reset();
    const tabs=['plain','guided','sheet','groups'];
    let active=tabs.includes(location.hash.slice(1))?location.hash.slice(1):'guided';
    const titles={plain:['Just tell it what to do.','Write a request. Check the matching bills before saving.'],guided:['Describe it. Let Jev check each bill.','Write your conditions in plain English, choose an action, and inspect the matches.'],sheet:['Find the bills first.','Use familiar filters, then turn the view into a rule.'],groups:['Make the logic visible.','Conditions inside a group stay together. Change AND to OR whenever you need.']};
    const options=(values,selected)=>values.map(value=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(value)}</option>`).join('');
    const actionSelect=(view,selected)=>`<select id="${view}-action" data-bind="${view}.action" aria-label="${view} action">${Object.entries(actions).map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join('')}</select>`;
    const ownerSelect=(view,selected)=>`<select id="${view}-owner" data-bind="${view}.owner" aria-label="${view} assignee">${options(people,selected)}</select>`;
    function evaluate(node,bill){
      if(node.kind==='group') return node.children.length>0&&(node.join==='all'?node.children.every(child=>evaluate(child,bill)):node.children.some(child=>evaluate(child,bill)));
      if(node.field==='category') return node.value.split('|').includes(bill.category);
      if(node.field==='amount') return /^\d+(\.\d{1,2})?$/.test(node.value)&&bill.amount>Math.round(Number(node.value)*100);
      if(node.field==='review') return node.value==='any'||bill.reviewed===(node.value==='reviewed');
      return Boolean(node.value.trim())&&bill.memo.toLowerCase().includes(node.value.trim().toLowerCase());
    }
    function valid(node){
      if(node.kind==='group') return node.children.length>0&&node.children.every(valid);
      if(node.field==='amount') return /^\d+(\.\d{1,2})?$/.test(node.value);
      return Boolean(node.value.trim());
    }
    const matches=tree=>bills.filter(bill=>evaluate(tree,bill));
    function filterTree(filters,join){return {kind:'group',join,children:filters.map(filter=>({kind:'group',join:filter.join,children:[
      {kind:'condition',field:'category',value:filter.categories.join('|')},
      {kind:'condition',field:'amount',value:filter.amount},
      ...(filter.review==='any'?[]:[{kind:'condition',field:'review',value:filter.review}])
    ]}))};}
    function describe(node,technical=false){
      if(node.kind==='group'){
        if(!node.children.length)return 'an empty group';
        const pieces=node.children.map(child=>describe(child,technical));
        const value=pieces.join(node.join==='all'?(technical?' AND ':' and '):(technical?' OR ':' or '));
        return node.children.length>1?`(${value})`:value;
      }
      if(node.field==='category'){
        const values=node.value.split('|').filter(Boolean),text=values.join(technical?' OR ':' or ')||'a category';
        return values.length>1?`(${text})`:text;
      }
      if(node.field==='amount')return `over ${money(Math.round(Number(node.value||0)*100))}`;
      if(node.field==='review')return node.value==='needs'?'needs review':node.value==='reviewed'?'already reviewed':'any review status';
      return `memo includes “${node.value}”`;
    }
    const readable=tree=>esc(describe(tree)).replace(/^\((.*)\)$/s,'$1');
    const receipt=(state,tree)=>state.saved?`<p class="success" role="status">Demo rule saved. ${matches(tree).length} sample bills ${actionPast[state.action]} for ${esc(state.owner.split(' ')[0])}.</p>`:'';
    function table(tree,{onlyMatches=false,compact=false}={}){
      const rows=onlyMatches?matches(tree):bills;
      if(!rows.length)return '<div class="empty" role="status">No sample bills match. Change a category, amount, or AND/OR choice.</div>';
      return `<div class="table-wrap"><table aria-label="Sample bills"><thead><tr><th>Vendor</th><th>Category</th><th class="num">Amount</th>${compact?'':'<th>Review</th>'}<th>Matches?</th></tr></thead><tbody>${rows.map(bill=>{
        const hit=evaluate(tree,bill);
        return `<tr class="${hit?'matched':'dim'}"><td><span class="bill-vendor">${bill.vendor}</span><span class="bill-note">${bill.note}</span></td><td>${bill.category}</td><td class="num">${money(bill.amount)}</td>${compact?'':`<td>${bill.reviewed?'Reviewed':'Needs review'}</td>`}<td>${hit?'<span class="match-label">Yes</span>':'<span class="no-match">No</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    const miniBills=tree=>`<div class="mini-bills">${matches(tree).length?matches(tree).map(bill=>`<div class="mini-bill"><span>${bill.vendor}</span><b>${money(bill.amount)}</b></div>`).join(''):'<p class="muted small">No sample bills match yet.</p>'}</div>`;
    function languageView(){
      const stale=plain.text!==plain.previewText, count=matches(plain.tree).length;
      return `<div class="shell language-layout"><section class="language-editor"><h2>What should this rule do?</h2><p>Use the same words you would use with a bookkeeper.</p>
        <label class="prompt-label" for="plain-text">Your request</label><textarea class="prompt" id="plain-text" data-bind="plain.text" spellcheck="false">${esc(plain.text)}</textarea>
        <div class="prompt-examples"><button data-example="tech">Software + equipment</button><button data-example="travel">Travel expenses</button><button data-example="utilities">Utility bills</button></div>
        <button class="primary" data-command="parse">Preview rule</button>${plain.error?`<p class="error" role="alert">${esc(plain.error)}</p>`:''}
        <div class="understood"><h3>${stale?'Your last preview':'Here is what will happen'}</h3><p class="logic-summary">Find bills for <mark>${readable(plain.tree)}</mark>.</p><p class="then-line">${actions[plain.action]} for <strong>${esc(plain.owner)}</strong>.</p>
          <div class="language-actions"><button data-command="save" data-view="plain" ${stale?'disabled':''}>Save demo rule</button><span class="small muted">${stale?'Preview your changes first.':`${count} matching bills`}</span></div>
          ${receipt(plain,plain.tree)}
        </div><p class="small muted" style="margin-top:25px;margin-bottom:0">Demo reads category, amount, review status, action, and recipient keywords.</p>
      </section><section><div class="preview-heading"><strong>Check the bills</strong><span>${count} of ${bills.length} match${stale?' · Previous preview':''}</span></div>${table(plain.tree,{compact:true})}<p class="preview-note">Matching rows are highlighted. The rest stay visible for comparison.</p></section></div>`;
    }

    function semanticLeaves(node){return node.kind==='semantic'? [node]:node.children.flatMap(semanticLeaves);}
    function semanticFind(node,target){if(node.id===target)return node;if(node.children)for(const child of node.children){const result=semanticFind(child,target);if(result)return result;}}
    function semanticValid(node){return node.kind==='semantic'?Boolean(node.text.trim()):node.children.length>0&&node.children.every(semanticValid);}
    function semanticResult(node,bill){
      if(node.kind==='semantic'){
        const normalize=text=>text.toLowerCase().replace(/[.?!]$/,'').trim();
        const key=Object.keys(semanticPrompts).find(key=>normalize(semanticPrompts[key])===normalize(node.text));
        let result=key?semanticFixtures[key][semanticBills.findIndex(item=>item.id===bill.id)]:'pending';
        if(node.negate)result=result==='true'?'false':result==='false'?'true':result;
        return result;
      }
      if(!node.children.length)return 'pending';
      const values=node.children.map(child=>semanticResult(child,bill));
      if(node.join==='all'&&values.includes('false'))return 'false';
      if(node.join==='any'&&values.includes('true'))return 'true';
      if(values.includes('pending'))return 'pending';
      if(values.includes('uncertain'))return 'uncertain';
      return node.join==='all'?'true':'false';
    }
    function semanticStats(){return Object.fromEntries(['true','false','uncertain','pending'].map(result=>[result,semanticBills.filter(bill=>semanticResult(guide.tree,bill)===result).length]));}
    function semanticWords(node){
      if(node.kind==='semantic')return (node.negate?'NOT: ':'')+node.text;
      return '('+node.children.map(semanticWords).join(node.join==='all'?' AND ':' OR ')+')';
    }
    const judgmentLabels={true:'Match',false:'No match',uncertain:'Uncertain',pending:'Not previewed'};
    const judgment=result=>'<span class="judgment judgment-'+result+'">'+judgmentLabels[result]+'</span>';
    function semanticEditor(node,depth=0){
      if(node.kind==='semantic'){
        const index=semanticLeaves(guide.tree).findIndex(item=>item.id===node.id)+1;
        return '<div class="semantic-condition"><div class="row spread"><label for="semantic-'+node.id+'" class="condition-label">Condition '+index+'</label><button class="quiet small" data-command="semantic-remove" data-id="'+node.id+'" aria-label="Remove condition '+index+'">Remove</button></div><textarea rows="2" id="semantic-'+node.id+'" data-semantic-text="'+node.id+'" placeholder="Describe what should be true about the bill...">'+esc(node.text)+'</textarea><div class="row spread semantic-condition-tools"><span class="small muted">Jev judges this condition for each bill.</span><select id="semantic-not-'+node.id+'" data-semantic-not="'+node.id+'" aria-label="Include or exclude condition '+index+'"><option value="match" '+(!node.negate?'selected':'')+'>Must match</option><option value="not" '+(node.negate?'selected':'')+'>Must not match (NOT)</option></select></div></div>';
      }
      return '<div class="semantic-group '+(depth?'semantic-nested':'')+'"><div class="semantic-group-head"><select id="semantic-join-'+node.id+'" data-semantic-join="'+node.id+'" aria-label="Combine '+(depth?'nested':'main')+' conditions"><option value="all" '+(node.join==='all'?'selected':'')+'>All conditions must match (AND)</option><option value="any" '+(node.join==='any'?'selected':'')+'>Any condition can match (OR)</option></select>'+(depth?'<button class="quiet small" data-command="semantic-remove" data-id="'+node.id+'">Remove group</button>':'')+'</div>'+node.children.map((child,index)=>(index?'<div class="semantic-connector">'+(node.join==='all'?'AND':'OR')+'</div>':'')+semanticEditor(child,depth+1)).join('')+'<div class="group-controls"><button data-command="semantic-add" data-id="'+node.id+'">Add condition</button>'+(depth<2?'<button class="quiet" data-command="semantic-group" data-id="'+node.id+'">Add group</button>':'')+'</div></div>';
    }
    function semanticPreview(){
      const conditions=semanticLeaves(guide.tree),stats=semanticStats();
      const rows=semanticBills.filter(bill=>guide.resultFilter==='all'||semanticResult(guide.tree,bill)===guide.resultFilter);
      const selected=semanticBills.find(bill=>bill.id===guide.inspect);
      return '<div class="semantic-preview"><div class="preview-counts" aria-live="polite"><span><strong>'+stats.true+'</strong> match</span><span><strong>'+stats.uncertain+'</strong> uncertain</span><span><strong>'+stats.false+'</strong> do not match</span>'+(stats.pending?'<span><strong>'+stats.pending+'</strong> not previewed</span>':'')+'</div><div class="row spread" style="margin:16px 0"><h3>Check the matching rows</h3><select id="guide-results" data-bind="guide.resultFilter" aria-label="Preview matching rows"><option value="all" '+(guide.resultFilter==='all'?'selected':'')+'>All sample bills</option><option value="true" '+(guide.resultFilter==='true'?'selected':'')+'>Matches only</option><option value="uncertain" '+(guide.resultFilter==='uncertain'?'selected':'')+'>Uncertain only</option><option value="false" '+(guide.resultFilter==='false'?'selected':'')+'>Nonmatches only</option></select></div><p class="small muted" style="margin-bottom:12px">Each column is a separate Jev judgment. Click a vendor to inspect the bill.</p><div class="table-wrap"><table aria-label="Jev condition results"><thead><tr><th>Bill</th>'+conditions.map((condition,index)=>'<th title="'+esc(condition.text)+'">Condition '+(index+1)+'</th>').join('')+'<th>Overall</th></tr></thead><tbody>'+rows.map(bill=>'<tr class="'+(semanticResult(guide.tree,bill)==='true'?'matched':'')+'"><td><button class="vendor-button" data-command="semantic-inspect" data-id="'+bill.id+'" aria-label="Inspect '+esc(bill.vendor)+'">'+bill.vendor+'</button><span class="bill-note">'+bill.id+' · '+money(bill.amount)+'</span></td>'+conditions.map(condition=>'<td>'+judgment(semanticResult(condition,bill))+'</td>').join('')+'<td>'+judgment(semanticResult(guide.tree,bill))+'</td></tr>').join('')+'</tbody></table></div>'+(!rows.length?'<p class="empty">No sample bills in this view.</p>':'')+(selected?'<section class="semantic-inspection" aria-label="Bill condition evidence"><div class="row spread"><h3>'+selected.vendor+'</h3><button class="quiet small" data-command="semantic-inspect" data-id="">Close</button></div><dl><dt>Line items</dt><dd>'+selected.note+'</dd><dt>Memo</dt><dd>'+selected.memo+'</dd></dl>'+conditions.map((condition,index)=>'<div class="condition-evidence"><div class="row spread"><b class="small">Condition '+(index+1)+'</b>'+judgment(semanticResult(condition,selected))+'</div><p>'+esc((condition.negate?'Must NOT match: ':'')+condition.text)+'</p></div>').join('')+'</section>':'')+'<p class="small muted" style="margin-top:15px">Only definite matches receive actions. Uncertain bills stay untouched.</p><p class="small muted" style="margin-top:8px">Simulated judgments for the sample prompts. New wording is kept exactly as typed; live Jev evaluation is unchanged in the app.</p></div>';
    }
    function guidedView(){
      const stats=semanticStats(),conditions=semanticLeaves(guide.tree),owner=guide.owner==='jev'?'the teammate Jev chooses':guide.owner;
      const stepTitles=['What should Jev look for?','What should happen to matches?','Which bills match?'];
      const stepDescriptions=['Describe each condition in English. Jev checks every bill against each one.','Choose an action for the bills that match your conditions.','Inspect the rows and their individual condition results before saving.'];
      let content='';
      if(guide.step===0)content=semanticEditor(guide.tree)+'<details class="semantic-examples"><summary>Try another example condition</summary>'+Object.entries(semanticPrompts).map(([key,text])=>'<button class="semantic-example" data-command="semantic-example" data-key="'+key+'">'+text+'</button>').join('')+'</details>';
      if(guide.step===1)content=Object.entries(actions).map(([value,label])=>'<label class="action-choice"><input type="radio" name="guide-action" value="'+value+'" data-radio-action="guide" '+(guide.action===value?'checked':'')+'><span><b>'+label+'</b><small>'+(value==='task'?'Give someone a clear follow-up.':value==='message'?'Prepare a message for approval.':'Make someone responsible for these bills.')+'</small></span></label>').join('')+(guide.action==='message'?'<label class="field" style="margin-top:24px">What should the message ask?<textarea id="guide-message" data-bind="guide.messageRequest" rows="3">'+esc(guide.messageRequest)+'</textarea></label>':'')+'<label class="field" style="margin-top:25px">'+(guide.action==='message'?'Who should receive the draft?':'Who is responsible?')+'<select id="guide-owner" data-bind="guide.owner">'+(guide.action==='message'?'<option value="jev" '+(guide.owner==='jev'?'selected':'')+'>Let Jev choose the right teammate</option>':'')+options(people,guide.owner)+'</select></label>';
      if(guide.step===2)content=semanticPreview()+'<hr class="divider"><div class="stack"><h3>For definite matches</h3><p>'+actions[guide.action]+' for <strong>'+esc(owner)+'</strong>.</p>'+(guide.action==='message'?'<p class="small muted">'+esc(guide.messageRequest)+'</p>':'')+'<label class="field" style="margin-top:8px">Rule name<input id="guide-name" data-bind="guide.name" value="'+esc(guide.name)+'" maxlength="80"></label></div>'+(guide.saved?'<p class="success" role="status">Demo rule saved. Your English conditions and AND/OR grouping are preserved. No real bills changed.</p>':'');
      return '<div class="shell guided-layout"><nav class="steps" aria-label="Rule setup steps">'+['Describe conditions','Choose action','Review matches'].map((label,index)=>'<button class="step-link" data-command="guide-step" data-step="'+index+'" '+(index===guide.step?'aria-current="step"':'')+'><span class="step-number" aria-hidden="true">'+(index+1)+'</span>'+label+'</button>').join('')+'</nav><section class="guide-content"><h2 tabindex="-1" id="guide-heading">'+stepTitles[guide.step]+'</h2><p>'+stepDescriptions[guide.step]+'</p><div class="guide-fields">'+content+'</div><div class="guide-nav"><button data-command="guide-step" data-step="'+(guide.step-1)+'" '+(guide.step===0?'disabled':'')+'>Back</button>'+(guide.step<2?'<button class="primary" data-command="guide-step" data-step="'+(guide.step+1)+'" '+(!semanticValid(guide.tree)?'disabled':'')+'>'+(guide.step===0?'Choose an action':'Review matching rows')+'</button>':'<button class="primary" data-command="save" data-view="guide" '+(!guide.name.trim()||!semanticValid(guide.tree)?'disabled':'')+'>Save demo rule</button>')+'</div></section><aside class="guide-summary"><h3>Your rule</h3><div class="summary-part"><b>'+conditions.length+' English condition'+(conditions.length===1?'':'s')+'</b><p>Jev judges each condition independently for every bill.</p></div><div class="summary-part"><b>How answers combine</b><p>'+esc(guide.tree.join==='all'?'Every condition must match (AND).':'Any condition can match (OR).')+'</p><details style="margin-top:10px"><summary class="small">See full grouping</summary><p class="small" style="margin-top:8px">'+esc(semanticWords(guide.tree))+'</p></details></div><div class="summary-part"><b>For matching bills</b><p>'+actions[guide.action]+' for '+esc(owner)+'.</p></div><div class="summary-part"><b>Sample preview</b><div class="side-counts"><span><strong>'+stats.true+'</strong> match</span><span><strong>'+stats.uncertain+'</strong> uncertain</span><span><strong>'+stats.false+'</strong> no match</span>'+(stats.pending?'<span><strong>'+stats.pending+'</strong> not previewed</span>':'')+'</div><button class="quiet small" style="padding-left:0;margin-top:10px" data-command="guide-step" data-step="2">View matching rows</button></div></aside></div>';
    }
    function sheetFilter(filter,index){
      return `<div class="${index?'sheet-group':''}">${index?`<div class="row spread"><span class="small muted">Group ${index+1}</span><button class="quiet small" data-command="remove-filter-group" data-view="sheet" data-index="${index}">Remove group</button></div>`:''}<div class="filter-row">
        <details class="filter"><summary>Category: ${esc(filter.categories.join(' or ')||'choose')}</summary><div class="filter-menu">${categories.map(category=>`<label><input type="checkbox" id="sheet-${index}-${category}" data-category="${category}" data-view="sheet" data-index="${index}" ${filter.categories.includes(category)?'checked':''}>${category}</label>`).join('')}</div></details>
        <select id="sheet-join-${index}" class="join-control" data-filter="join" data-view="sheet" data-index="${index}" aria-label="Combine filters in group ${index+1}"><option value="all" ${filter.join==='all'?'selected':''}>AND</option><option value="any" ${filter.join==='any'?'selected':''}>OR</option></select>
        <label class="row small">Over $ <input type="number" min="0" step="0.01" id="sheet-amount-${index}" data-filter="amount" data-view="sheet" data-index="${index}" value="${esc(filter.amount)}" aria-label="Sheet amount for group ${index+1}"></label>
        <span class="small muted">${filter.join==='all'?'and':'or'}</span><select id="sheet-review-${index}" data-filter="review" data-view="sheet" data-index="${index}" aria-label="Review filter for group ${index+1}"><option value="needs" ${filter.review==='needs'?'selected':''}>Needs review</option><option value="reviewed" ${filter.review==='reviewed'?'selected':''}>Reviewed</option><option value="any" ${filter.review==='any'?'selected':''}>Any status</option></select></div></div>`;
    }
    function spreadsheetView(){
      const tree=filterTree(sheet.filters,sheet.join),count=matches(tree).length;
      return `<div class="shell sheet-layout"><section class="sheet-main"><div class="sheet-tools"><h2>Filter your bills</h2>${sheet.filters.length>1?`<div class="row small"><span>Between groups</span><select id="sheet-root-join" class="join-control" data-bind="sheet.join"><option value="any" ${sheet.join==='any'?'selected':''}>OR</option><option value="all" ${sheet.join==='all'?'selected':''}>AND</option></select></div>`:''}${sheet.filters.map(sheetFilter).join('')}<button class="quiet small" data-command="add-filter-group" data-view="sheet">Add another filter group</button></div>
        <div class="sheet-count"><span role="status">${count} of ${bills.length} bills match</span><label class="row"><input type="checkbox" id="sheet-only" data-bind="sheet.matchesOnly" ${sheet.matchesOnly?'checked':''}>Show matches only</label></div>${table(tree,{onlyMatches:sheet.matchesOnly})}</section>
        <aside class="sheet-save"><h2>Keep this as a rule</h2><p>The filters find the bills. The rule tells us what to do next.</p><label class="field">Rule name<input id="sheet-name" data-bind="sheet.name" value="${esc(sheet.name)}" maxlength="80"></label><label class="field">When a bill matches${actionSelect('sheet',sheet.action)}</label><label class="field">Assigned to${ownerSelect('sheet',sheet.owner)}</label><div class="rule-count"><strong>${count} sample bills</strong> would match this view.</div><button class="primary" data-command="save" data-view="sheet" ${!sheet.name.trim()||!valid(tree)?'disabled':''}>Save demo rule</button>${receipt(sheet,tree)}</aside></div>`;
    }
    function findNode(node,nodeId){if(node.id===nodeId)return node; if(node.kind==='group')for(const child of node.children){const found=findNode(child,nodeId);if(found)return found;}}
    function conditionRow(node){
      let value='';
      if(node.field==='category')value=`<select id="value-${node.id}" data-node-value="${node.id}" aria-label="Category value">${[['Software|Equipment','Software or equipment'],...categories.map(category=>[category,category])].map(([val,label])=>`<option value="${esc(val)}" ${val===node.value?'selected':''}>${label}</option>`).join('')}</select>`;
      else if(node.field==='amount')value=`<span class="money-prefix">$</span><input id="value-${node.id}" type="number" min="0" step="0.01" data-node-value="${node.id}" value="${esc(node.value)}" aria-label="Amount cutoff">`;
      else if(node.field==='review')value=`<select id="value-${node.id}" data-node-value="${node.id}" aria-label="Review value"><option value="needs" ${node.value==='needs'?'selected':''}>Needs review</option><option value="reviewed" ${node.value==='reviewed'?'selected':''}>Reviewed</option></select>`;
      else value=`<input id="value-${node.id}" data-node-value="${node.id}" value="${esc(node.value)}" placeholder="e.g. receipt" aria-label="Words in memo">`;
      return `<div class="condition"><select id="field-${node.id}" data-node-field="${node.id}" aria-label="Condition type">${[['category','Category is'],['amount','Amount over'],['review','Review is'],['memo','Memo contains']].map(([val,label])=>`<option value="${val}" ${val===node.field?'selected':''}>${label}</option>`).join('')}</select><div class="condition-value">${value}</div><button class="quiet" data-command="remove-node" data-id="${node.id}" aria-label="Remove ${node.field} condition">Remove</button></div>`;
    }
    function groupEditor(node,depth=0){
      return `<div class="group" aria-label="${depth?'Nested match group':'Main match group'}"><div class="group-top"><select id="join-${node.id}" data-node-join="${node.id}" aria-label="Combine ${depth?'nested':'main'} group"><option value="all" ${node.join==='all'?'selected':''}>All of these must match (AND)</option><option value="any" ${node.join==='any'?'selected':''}>Any of these can match (OR)</option></select>${depth?`<button class="quiet small" data-command="remove-node" data-id="${node.id}">Remove group</button>`:''}</div><div class="group-body">${node.children.length?node.children.map((child,index)=>`${index?`<div class="connector">${node.join==='all'?'AND':'OR'}</div>`:''}${child.kind==='group'?groupEditor(child,depth+1):conditionRow(child)}`).join(''):'<p class="group-empty">Add a condition to start this group.</p>'}<div class="group-controls"><button data-command="add-condition" data-id="${node.id}">Add condition</button>${depth<2?`<button data-command="add-subgroup" data-id="${node.id}">Add group</button>`:''}</div></div></div>`;
    }
    function groupsView(){
      const tree=groups.tree,count=matches(tree).length;
      return `<div class="shell groups-layout"><section class="groups-editor"><div class="groups-top"><div><h2>When a bill matches...</h2><p class="small muted" style="margin-top:7px">Use a group for conditions that belong together.</p></div></div>${groupEditor(tree)}<div class="then-action"><h3>Then do this</h3><label class="field">Action${actionSelect('groups',groups.action)}</label><label class="field">Assigned to${ownerSelect('groups',groups.owner)}</label></div></section>
        <aside class="groups-proof"><h3>Your rule in words</h3><p class="logic-summary">Find bills matching <mark>${readable(tree)}</mark>.</p><p style="margin-top:18px;font-size:13px">${actions[groups.action]} for <strong>${esc(groups.owner)}</strong>.</p><details class="grouping-details"><summary>See the order of operations</summary><div class="parentheses">${esc(describe(tree,true))}</div><p class="small muted" style="margin-top:8px">Each set of parentheses is evaluated together.</p></details><hr class="divider"><h3>${count} sample bills match</h3>${miniBills(tree)}<div class="save-area"><label class="field">Rule name<input id="groups-name" data-bind="groups.name" value="${esc(groups.name)}" maxlength="80"></label><button class="primary" data-command="save" data-view="groups" ${!groups.name.trim()||!valid(tree)?'disabled':''}>Save demo rule</button>${!valid(tree)?'<p class="error" role="alert">Fill in each condition and remove empty groups.</p>':''}${receipt(groups,tree)}</div></aside></div>`;
    }
    function render(){
      const focused=document.activeElement,focusId=focused?.id,start=focused?.selectionStart,end=focused?.selectionEnd;
      const openFilters=[...document.querySelectorAll('details.filter[open]')].map(detail=>[...document.querySelectorAll('details.filter')].indexOf(detail));
      document.querySelector('.bottom-note span').textContent=active==='guided'?'Write conditions in English. Jev evaluates each condition separately for each bill.':'Same starting rule in these options: software or equipment, over $500, still needs review.';
      document.getElementById('view-title').textContent=titles[active][0];
      document.getElementById('view-description').textContent=titles[active][1];
      for(const tab of document.querySelectorAll('[data-tab]')){tab.setAttribute('aria-selected',String(tab.dataset.tab===active));tab.tabIndex=tab.dataset.tab===active?0:-1;}
      const panel=document.getElementById('demo-panel');panel.setAttribute('aria-labelledby',`tab-${active}`);
      panel.innerHTML=({plain:languageView,guided:guidedView,sheet:spreadsheetView,groups:groupsView}[active])();
      if(active==='sheet')for(const index of openFilters){const detail=document.querySelectorAll('details.filter')[index];if(detail)detail.open=true;}
      if(focusId){const replacement=document.getElementById(focusId);if(replacement){replacement.focus({preventScroll:true});if(start!==null&&start!==undefined)try{replacement.setSelectionRange(start,end);}catch{}}}
    }
    function switchTab(tab){if(!tabs.includes(tab))return;active=tab;history.replaceState(null,'',`#${tab}`);render();window.scrollTo(0,0);}
    document.querySelector('.tabs').addEventListener('click',event=>{const tab=event.target.closest('[data-tab]');if(tab)switchTab(tab.dataset.tab);});
    document.querySelector('.tabs').addEventListener('keydown',event=>{
      const index=tabs.indexOf(active);let next;
      if(event.key==='ArrowRight')next=(index+1)%4;else if(event.key==='ArrowLeft')next=(index+3)%4;else if(event.key==='Home')next=0;else if(event.key==='End')next=3;
      if(next!==undefined){event.preventDefault();switchTab(tabs[next]);document.getElementById(`tab-${tabs[next]}`).focus();}
    });
    window.addEventListener('hashchange',()=>{if(tabs.includes(location.hash.slice(1))){active=location.hash.slice(1);render();}});
    document.getElementById('reset').addEventListener('click',()=>{reset();render();});
    function parsePrompt(){
      const text=plain.text.toLowerCase();
      const selected=categories.filter(category=>new RegExp(category.toLowerCase()+'|'+({Software:'subscription|licenses',Equipment:'hardware|laptop|computer',Travel:'flight|airline',Utilities:'utility|electricity'}[category])).test(text));
      if(!selected.length){plain.error='Try a category: software, equipment, travel, or utilities.';render();return;}
      const amount=text.match(/(?:over|above|more than|greater than)\s*\$?([\d,]+(?:\.\d{1,2})?)/);
      const children=[condition('category',selected.join('|'))];
      if(amount)children.push(condition('amount',amount[1].replaceAll(',','')));
      if(/need[s]? review|unreviewed|not reviewed/.test(text))children.push(condition('review','needs'));
      else if(/already reviewed|reviewed bills/.test(text))children.push(condition('review','reviewed'));
      const categoryOr=selected.length>1&&/\bor\b/.test(text);
      // An explicit "or over $..." makes category and amount alternatives.
      const rootOr=/\bor\s+(?:over|above|more than|greater than)\b/.test(text);
      if(selected.length>1&&!categoryOr&&/\band\b/.test(text))children[0]=group('all',selected.map(category=>condition('category',category)));
      plain.tree=group(rootOr?'any':'all',children);
      plain.action=/\b(message|email|ask)\b/.test(text)?'message':/\btask\b/.test(text)?'task':'assign';
      plain.owner=people.find(person=>text.includes(person.split(' ')[0].toLowerCase()))||people[0];
      plain.previewText=plain.text;plain.error='';plain.saved=false;render();
    }
    document.getElementById('demo-panel').addEventListener('click',event=>{
      const example=event.target.closest('[data-example]');
      if(example){plain.text={tech:promptDefault,travel:'Find travel bills over $250 that need review. Draft a message to Priya.',utilities:'Find utility bills over $200 that need review. Assign them to Marcus.'}[example.dataset.example];plain.saved=false;parsePrompt();return;}
      const button=event.target.closest('[data-command]');if(!button)return;
      const command=button.dataset.command,view=button.dataset.view,nodeId=button.dataset.id;
      if(command==='parse'){parsePrompt();return;}
      if(command.startsWith('semantic-')){
        const node=semanticFind(guide.tree,nodeId);
        if(command==='semantic-add')node.children.push(semanticCondition());
        if(command==='semantic-group')node.children.push(semanticGroup('any',[semanticCondition()]));
        if(command==='semantic-remove'){
          const remove=group=>{if(group.children){group.children=group.children.filter(child=>child.id!==nodeId);group.children.forEach(remove);}};remove(guide.tree);
        }
        if(command==='semantic-example')guide.tree.children.push(semanticCondition(semanticPrompts[button.dataset.key]));
        if(command==='semantic-inspect')guide.inspect=nodeId||null;
        guide.saved=false;render();return;
      }
      if(command==='save'){({plain,guide,sheet,groups}[view]).saved=true;render();return;}
      if(command==='guide-step'){guide.step=Math.max(0,Math.min(2,Number(button.dataset.step)));render();document.getElementById('guide-heading')?.focus({preventScroll:true});return;}
      if(command==='add-filter-group'){const state=view==='guide'?guide:sheet;state.filters.push({categories:['Travel'],amount:'250',review:'needs',join:'all'});state.saved=false;render();return;}
      if(command==='remove-filter-group'){const state=view==='guide'?guide:sheet;state.filters.splice(Number(button.dataset.index),1);state.saved=false;render();return;}
      const target=findNode(groups.tree,nodeId);
      if(command==='add-condition')target.children.push(condition('memo','receipt'));
      if(command==='add-subgroup')target.children.push(group('any',[condition('category','Travel'),condition('category','Utilities')]));
      if(command==='remove-node'){
        const remove=node=>{if(node.kind==='group'){node.children=node.children.filter(child=>child.id!==nodeId);node.children.forEach(remove);}};remove(groups.tree);
      }
      groups.saved=false;render();
    });
    function change(event){
      const element=event.target,d=element.dataset;
      // Text is handled on input. Ignore its later blur/change notification so
      // replacing the editor cannot recursively render while the DOM is removed.
      if(event.type==='change'&&element.matches('input:not([type=checkbox]):not([type=radio]),textarea'))return;
      if(d.semanticText){semanticFind(guide.tree,d.semanticText).text=element.value;guide.saved=false;}
      else if(d.semanticJoin){semanticFind(guide.tree,d.semanticJoin).join=element.value;guide.saved=false;}
      else if(d.semanticNot){semanticFind(guide.tree,d.semanticNot).negate=element.value==='not';guide.saved=false;}
      else if(d.bind){const [view,key]=d.bind.split('.');const state={plain,guide,sheet,groups}[view];state[key]=element.type==='checkbox'?element.checked:element.value;state.saved=false;if(view==='plain')plain.error='';}
      else if(d.category){const state=d.view==='guide'?guide:sheet,filter=state.filters[Number(d.index)];filter.categories=element.checked?[...new Set([...filter.categories,d.category])]:filter.categories.filter(category=>category!==d.category);state.saved=false;}
      else if(d.filter){const state=d.view==='guide'?guide:sheet;state.filters[Number(d.index)][d.filter]=element.value;state.saved=false;}
      else if(d.reviewToggle!==undefined){guide.filters[Number(d.reviewToggle)].review=element.checked?'needs':'any';guide.saved=false;}
      else if(d.radioAction){guide.action=element.value;if(guide.action!=='message'&&guide.owner==='jev')guide.owner=people[0];guide.saved=false;}
      else if(d.nodeJoin){findNode(groups.tree,d.nodeJoin).join=element.value;groups.saved=false;}
      else if(d.nodeValue){findNode(groups.tree,d.nodeValue).value=element.value;groups.saved=false;}
      else if(d.nodeField){const node=findNode(groups.tree,d.nodeField);node.field=element.value;node.value={category:'Software|Equipment',amount:'500',review:'needs',memo:'receipt'}[element.value];groups.saved=false;}
      else return;
      render();
    }
    document.getElementById('demo-panel').addEventListener('change',change);
    document.getElementById('demo-panel').addEventListener('input',event=>{if(event.target.matches('input:not([type=checkbox]):not([type=radio]),textarea'))change(event);});
    document.addEventListener('click',event=>{if(!event.target.closest('details.filter'))document.querySelectorAll('details.filter[open]').forEach(detail=>detail.open=false);});
    render();
  </script>
</body>
</html>
